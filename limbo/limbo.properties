# Local rollback stub limbo config. See README.md.
bind.host=0.0.0.0
bind.port=25565

# Where to send players back to when a match ends (your proxy).
proxy.host=127.0.0.1
proxy.port=25565

# Capture-replay data you supply (clientbound wire frames; see README.md).
packets.config=config.bin
packets.play=play.bin

# Your exact 1.21.11 protocol version number + name (shown in the status ping). 1.21.11 IS protocol
# 774 (its own version.json says so); the capture in config.bin/play.bin is a 1.21.11 capture, and the
# number here is what the handshake is matched against, so it has to be 774 or a 1.21.11 client is
# refused.
protocol.version=774
protocol.name=1.21.11

# SECOND VERSION (26.1.2). One limbo serves every version: the connecting client's handshake protocol
# picks the matching capture. Set protocol.version.alt to the alt client's protocol number (-1 disables
# the alt entirely and the limbo is 1.21.11-only). packets.config.alt/packets.play.alt are that version's
# own capture. The alt PLAY ids are below (play.id.*.alt). A client whose protocol has NO capture is
# refused at login rather than served another version's bytes; record one with
# gradlew devLimboCapture -PcaptureVersion=26.1.2
packets.config.alt=config-26.1.2.bin
packets.play.alt=play-26.1.2.bin
protocol.version.alt=775
protocol.name.alt=26.1.2

# THIRD VERSION (26.2 / protocol 776), through the numbered capture.N slots. capture.N.id.* default to
# the 26.x ids for any protocol >= 775, so only the files and the version need naming here.
capture.2.protocol=776
capture.2.name=26.2
capture.2.config=config-26.2.bin
capture.2.play=play-26.2.bin

# A capture that is named here but whose files are missing aborts startup, because the alternative is a
# limbo that looks healthy and disconnects every client on that version mid-handshake. Set this to true
# only to start anyway and refuse those clients at login.
captures.lenient=false

# Channel the mod sends on match end to request a transfer back.
return.channel=jackpotrollback:return

# Play-phase packet ids the limbo builds itself (version-fragile). The capture proxy prints the
# observed PLAY ids — set play.id.keepalive to the clientbound keepalive id, play.id.custompayload to
# the serverbound plugin-message id. play.id.transfer is the clientbound Transfer id (from a protocol
# report). If unsure of the keepalive id, set play.keepalive.enabled=false for a first smoke test.
play.keepalive.enabled=true
play.keepalive.seconds=10
play.id.keepalive=0x2B
play.id.transfer=0x7F
play.id.custompayload=0x15

# 1.21.11 chunk sections are written as a single short (nonEmptyBlockCount); 26.x adds a second short
# (fluidCount). The limbo builds the empty void chunks itself, so getting this wrong makes the client
# fail to decode them. It defaults to protocol >= 775 and is spelled out here so it survives a version
# bump of the line above.
play.section.fluidcount=false

# Alt-version (26.1.2 / protocol 775) PLAY ids — used when the alt capture is served. Derived from the
# 26.1.2 GameProtocols registration order: clientbound KEEP_ALIVE=0x2C, clientbound TRANSFER=0x81,
# serverbound CUSTOM_PAYLOAD=0x16. Each defaults to the main value above if unset (wrong for 26.1.2, so
# keep these explicit). The chunk-data id is auto-detected from the alt capture, so no .alt is needed.
play.id.keepalive.alt=0x2C
play.id.transfer.alt=0x81
play.id.custompayload.alt=0x16

# VOID WORLD: the captured play.bin contains the original session's terrain (chunk packets, which also
# carry light). Each captured terrain chunk is REPLACED with an empty (all-air) chunk at its own coords,
# so the client renders a clean VOID — the captured dimension (and its day sky) is kept, and the spawn
# chunk still exists so "Loading terrain..." dismisses instantly. The rollback mod then pastes the arena.
# The chunk-data id is auto-detected from the capture by frequency (one level_chunk_with_light is sent per
# loaded chunk, so it is by far the most common large packet) and ONLY that id is ever rewritten, so a
# light_update is never touched. Set play.id.chunkdata to override with the exact clientbound
# level_chunk_with_light id (the capture proxy prints it; 0x27 on protocol 772). -1 = auto-detect.
# play.world.sections = the dimension height in 16-block sections (overworld -64..320 = 24).
# Set play.strip.world=false to replay the original terrain instead.
play.strip.world=true
play.strip.world.minbytes=1024
play.id.chunkdata=-1
play.world.sections=24

# NATIVE ARENA TERRAIN: for large arenas the duel server (mcleagues) pre-bakes the arena into real chunk
# packets and SETs them in Redis under rollback:arena:<uuid> (gzip'd, per-slot, short TTL). When enabled
# AND a Redis host is configured, the limbo GETs that blob on join and serves the arena's columns as real
# chunks (full-bright light inline) instead of the void, for the registered player only — every other
# column still voids. No arena registered for a player → the void path above runs unchanged. Redis host/
# port/password default to the LOCAL_REDIS_HOST/LOCAL_REDIS_PORT/LOCAL_REDIS_PASSWORD env vars — the SAME
# region-local Redis mcleagues publishes to (getLocalRedis()), NOT the global one.
play.native.enabled=true
redis.host=
redis.port=6379
redis.password=
# Max ms to wait at PLAY for the async Redis arena lookup before serving void (the GET starts at login).
play.native.wait.ms=300
