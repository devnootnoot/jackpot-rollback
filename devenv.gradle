                + ' the limbo on 127.0.0.1:' + project.ext.limboBindPort + '. Push one with'
                + ' gradlew devAssign -Pmod=A|B|both.')
        logger.lifecycle('run it with:  gradlew devRun')
        logger.lifecycle('direct edge links: edge-a listens on udp/7787, edge-b on udp/7788. A'
                + ' brokered assignment carrying a peer endpoint skips the relay entirely; the'
                + ' relay is still started and is still used for the modded client path, for a'
                + ' peer that advertises no direct port, and whenever both players land on one'
                + ' edge. Set rollback.edge.direct-links: true in mcleagues-core to turn it on.')
        logger.lifecycle('optional: gradlew devSampleArena  (real voxel arena instead of the flat fallback)')
        logger.lifecycle('optional: gradlew devSetup -Prounds=3  (/edge best-of: first to 3 rounds,'
                + ' written into BOTH edge configs)')
        logger.lifecycle('dev-kit.enabled=true in BOTH edge configs by default: assignments with no'
                + ' setup bytes get the demo kit for their gameType. Pass -PnoDevKit to start'
                + ' empty-handed.')
        logger.lifecycle('the demo kit is NOT a real kit - only mcleagues-core puts real setup bytes'
                + ' on an assignment. Pick one with:'
                + ' gradlew devAssign -PplayerA=x -PplayerB=y -PgameType=NETHERITE_POT')
        logger.lifecycle('arena: a core assignment ships the real arena bytes and both edges load'
                + ' them from redis. devAssign can do the same now:'
                + ' gradlew devAssign -PplayerA=x -PplayerB=y -ParenaName=colosseum'
                + ' (reading ' + project.ext.realArenaDir + ').'
                + ' Without -ParenaName it still ships nothing, so arena.bin'
                + ' (gradlew devSampleArena) or the flat fallback is used locally.')
    }
}

tasks.register('devStampEdgePlugin') {
    group = 'devenv'
    description = 'Push the edge plugin that was just built into every dev server directory that' +
            ' already exists, and stamp the build every one of them must match at startup.' +
            ' Runs automatically after :edge:jar so a plain gradlew build cannot leave the dev' +
            ' stack running the edge from an earlier build.'
    dependsOn ':edge:jar'
    outputs.upToDateWhen { false }
    doLast {
        def pluginJar = project(':edge').tasks.named('jar').get().archiveFile.get().asFile
        if (!pluginJar.isFile() || pluginJar.length() == 0) {
            return
        }
        def want = project.ext.sha256Of.call(pluginJar)
        project.ext.edgeNodes.each { node ->
            def dir = new File(project.ext.devRoot, node.name)
            if (!dir.isDirectory()) {
                return
            }
            def pluginsDir = new File(dir, 'plugins')
            def target = new File(pluginsDir, project.ext.EDGE_PLUGIN_FILE)
            boolean copied = false
            String remapFailure = ''
            try {
                pluginsDir.mkdirs()
                remapFailure = project.ext.clearRemapCache.call(pluginsDir)
                target.bytes = pluginJar.bytes
                copied = want == project.ext.sha256Of.call(target)
            } catch (Exception ignored) {
                copied = false
            }
            project.ext.stampEdgePlugin.call(dir, want)
            if (!remapFailure.isEmpty()) {
                logger.error(remapFailure)
            }
            if (copied && remapFailure.isEmpty()) {
                logger.lifecycle('refreshed ' + target + ' (sha256 ' + want.substring(0, 16)
                        + ', Paper remap cache cleared)')
            } else if (copied) {
                logger.error('refreshed ' + target + ' but the remap cache under ' + pluginsDir
                        + '/' + project.ext.EDGE_REMAP_DIR + ' survived, so ' + node.name
                        + ' would still load the previous build. Stop it and run:  gradlew devSetup')
            } else {
                logger.error('COULD NOT REFRESH ' + target + ' - something is holding it open,'
                        + ' almost certainly a server started from an earlier build. The startup'
                        + ' fence for ' + node.name + ' now expects ' + want.substring(0, 16)
                        + ', so that server refuses to enable its plugin instead of running'
                        + ' source nobody is reading. Stop it and run:  gradlew devSetup')
            }
        }
    }
}

project(':edge').tasks.named('jar').configure { finalizedBy rootProject.tasks.named('devStampEdgePlugin') }

tasks.register('devVerifyEdgeDeploy') {
    group = 'verification'
    description = 'Fail if what a provisioned dev edge would actually LOAD is not the plugin this' +
            ' source tree builds right now. That is the jar under plugins/, every other jar in' +
            ' that directory, and the Paper remap cache that shadows all of them.'
    dependsOn ':edge:jar'
    mustRunAfter 'devSetup'
    outputs.upToDateWhen { false }
    doLast {
        def pluginJar = project(':edge').tasks.named('jar').get().archiveFile.get().asFile
        if (!pluginJar.isFile() || pluginJar.length() == 0) {
            throw new GradleException(':edge:jar produced nothing at ' + pluginJar
                    + ', so there is no build to compare the dev stack against.')
        }
        def want = project.ext.sha256Of.call(pluginJar)
        def problems = []
        def checked = 0
        project.ext.edgeNodes.each { node ->
            def dir = new File(project.ext.devRoot, node.name)
            if (!dir.isDirectory()) {
                problems.add(node.name + ' is not provisioned at all (' + dir + ')')
                return
            }
            def loadProblems = project.ext.edgeLoadProblems.call(dir, want)
            if (!loadProblems.isEmpty()) {
                loadProblems.each { problems.add(node.name + ': ' + it) }
                return
            }
            checked++
            def marker = new File(dir, 'plugins/JackpotEdge/' + project.ext.EDGE_EXPECTED_FILE)
            if (!marker.isFile()) {
                problems.add(node.name + ' has no ' + project.ext.EDGE_EXPECTED_FILE
                        + ', so its plugin would enable without checking anything')
                return
            }
            def stamped = marker.readLines().find { !it.trim().isEmpty() && !it.trim().startsWith('#') }
            if (stamped?.trim() != want) {
                problems.add(node.name + ' is stamped ' + stamped + ' and this tree builds ' + want)
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException(([
                    'the dev stack under ' + project.ext.devRoot + ' is not running this source'
                            + ' tree:'
            ] + problems.collect { '  ' + it } + [
                    'Provision it with:  gradlew devSetup'
            ]).join(System.lineSeparator()))
        }
        if (checked != project.ext.edgeNodes.size()) {
            throw new GradleException('checked ' + checked + ' of '
                    + project.ext.edgeNodes.size() + ' edges, so this proved nothing.')
        }
        logger.lifecycle('every provisioned edge would LOAD this build (sha256 '
                + want.substring(0, 16) + '): one jar under plugins/, no second jar beside it, and'
                + ' no ' + project.ext.EDGE_REMAP_DIR + ' copy of any other build shadowing it.'
                + ' Prove it against a running server with:  gradlew devVerifyEdgeBoot')
    }
}

tasks.register('devVerifyEdgeBoot') {
    group = 'verification'
    description = 'Start every provisioned edge for real and fail unless its own build fence says' +
            ' on the way up that the plugin it loaded is this build. devVerifyEdgeDeploy reads' +
            ' the disk; this reads the server.'
    dependsOn 'devDownloadPaper', ':edge:jar'
    mustRunAfter 'devSetup', 'devVerifyEdgeDeploy'
    outputs.upToDateWhen { false }
    doLast {
        def pluginJar = project(':edge').tasks.named('jar').get().archiveFile.get().asFile
        def want = project.ext.sha256Of.call(pluginJar)
        def fence = project.ext.simFenceOf.call(pluginJar)
        def javaExe = System.getProperty('java.home') + '/bin/java'
        def timeoutMs = ((project.findProperty('bootTimeoutSeconds') ?: '300').toString() as int) * 1000L
        def running = []
        project.ext.edgeNodes.each { node ->
            def dir = new File(project.ext.devRoot, node.name)
            if (!dir.isDirectory()) {
                throw new GradleException(node.name + ' is not provisioned at ' + dir
                        + '. Run:  gradlew devSetup')
            }
            def pb = new ProcessBuilder([javaExe, '-Xms1G', '-Xmx2G', '-jar',
                                         project.ext.paperJar.absolutePath, '--nogui'])
            pb.directory(dir)
            pb.redirectErrorStream(true)
            def proc = pb.start()
            def state = [fenceOk: false, stale: false, version: -1, done: false]
            def reader = new Thread({
                proc.inputStream.eachLine { line ->
                    println('[' + node.name + '] ' + line)
                    synchronized (state) {
                        if (line.contains('STALE EDGE PLUGIN')) {
                            state.stale = true
                        }
                        if (line.contains('build fence: this plugin is the jar the last gradle'
                                + ' build produced (sha256 ' + want.substring(0, 16) + ')')) {
                            state.fenceOk = true
                        }
                        def match = line =~ /protocolVersion=(-?\d+)/
                        if (match.find()) {
                            state.version = match.group(1) as int
                        }
                        if (line.contains('edge ready: slot=')) {
                            state.done = true
                        }
                    }
                }
            })
            reader.setDaemon(true)
            reader.start()
            running.add([node: node, proc: proc, state: state])
        }
        def deadline = System.currentTimeMillis() + timeoutMs
        try {
            while (System.currentTimeMillis() < deadline) {
                boolean settled = running.every { r ->
                    synchronized (r.state) {
                        return r.state.stale
                                || (r.state.done && r.state.fenceOk && r.state.version >= 0)
                                || !r.proc.isAlive()
                    }
                }
                if (settled) {
                    break
                }
                Thread.sleep(500)
            }
        } finally {
            running.each { r ->
                try {
                    r.proc.outputStream.write("stop\n".getBytes('UTF-8'))
                    r.proc.outputStream.flush()
                } catch (Exception ignored) {
                }
            }
            running.each { r ->
                if (!r.proc.waitFor(45, TimeUnit.SECONDS)) {
                    r.proc.destroyForcibly()
                    r.proc.waitFor()
                }
            }
        }
        def problems = []
        running.each { r ->
            def s = r.state
            if (s.stale) {
                problems.add(r.node.name + ' refused to enable its plugin: its own build fence'
                        + ' says the jar it LOADED is not the one this tree built')
            } else if (!s.fenceOk) {
                problems.add(r.node.name + ' never printed the build fence for sha256 '
                        + want.substring(0, 16) + ', so nothing on that server confirmed which'
                        + ' plugin it is running')
            }
            if (s.version != fence.version) {
                problems.add(r.node.name + ' came up on protocolVersion ' + s.version
                        + ' and this tree builds ' + fence.version)
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException((['a real boot of the dev stack did not run this build:']
                    + problems.collect { '  ' + it }
                    + ['Provision it with:  gradlew devSetup']).join(System.lineSeparator()))
        }
        logger.lifecycle('')
        logger.lifecycle('every edge STARTED, loaded sha256 ' + want.substring(0, 16)
                + ' and reported protocolVersion ' + fence.version + ' (checksumRev ' + fence.rev
                + ', inputBytes ' + fence.bytes + '), then stopped again')
    }
}

