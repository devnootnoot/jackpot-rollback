tasks.register('devRun') {
    group = 'devenv'
    description = 'Start the relay, the limbo and both edge servers for local testing.'
    dependsOn 'devSetup', 'devVerifyEdgeDeploy', 'devLimboConfig', ':limbo:jar'
    if (!project.hasProperty('flatArena')) {
        dependsOn 'devSampleArena'
    }
    doLast {
        def procs = []
        def javaExe = System.getProperty('java.home') + '/bin/java'
        def relayJar = project(':relay').tasks.named('jar').get().archiveFile.get().asFile

        def pidDir = new File(project.ext.devRoot, 'pids')
        pidDir.mkdirs()
        pidDir.listFiles()?.each { f ->
            try {
                def stale = ProcessHandle.of(Long.parseLong(f.text.trim()))
                if (stale.isPresent() && stale.get().isAlive()) {
                    logger.lifecycle('killing stale ' + f.name.replace('.pid', '')
                            + ' (pid ' + f.text.trim() + ')')
                    stale.get().destroyForcibly()
                }
            } catch (Exception ignored) {
            }
            f.delete()
        }

        def spawn = { List cmd, File dir, String tag, Map env = [:] ->
            def pb = new ProcessBuilder(cmd)
            pb.directory(dir)
            env.each { k, v -> pb.environment().put(k.toString(), v.toString()) }
            pb.redirectErrorStream(true)
            def proc = pb.start()
            procs.add(proc)
            new File(pidDir, tag + '.pid').text = String.valueOf(proc.pid())
            def t = new Thread({
                proc.inputStream.eachLine { line -> println('[' + tag + '] ' + line) }
            })
            t.setDaemon(true)
            t.start()
            return proc
        }

        def relayEnv = [:]
        if (project.hasProperty('relaySlotSecret')) {
            relayEnv['RELAY_SLOT_SECRET'] = project.property('relaySlotSecret').toString()
            relayEnv['RELAY_BIND'] = '127.0.0.1'
            logger.lifecycle('relay starts in DERIVED mode: it verifies every HELLO against'
                    + ' HMAC-SHA256(relaySlotSecret, sessionId, slot). Push assignments with the'
                    + ' SAME -PrelaySlotSecret or the relay drops both peers of the session.')
        }
        boolean refereeOn = !project.hasProperty('noReferee')
        if (refereeOn) {
            relayEnv['RELAY_CONTROL_SECRET'] = project.ext.devRefereeSecret.call()
            relayEnv['RELAY_CONTROL_PORT'] = project.ext.devRefereePort.call().toString()
        }
        spawn([javaExe, '-jar', relayJar.absolutePath, '7777'], project.ext.devRoot, 'relay',
                relayEnv)
        boolean limboStarted = false
        if (!project.hasProperty('noLimbo')) {
            def limboJar = project(':limbo').tasks.named('jar').get().archiveFile.get().asFile
            def limboCfg = new File(project.ext.devRoot, 'limbo.properties')
            spawn([javaExe, '-jar', limboJar.absolutePath, limboCfg.absolutePath],
                    project.ext.devRoot, 'limbo')
            limboStarted = true
        }
        def edgeEnv = [:]
        if (project.hasProperty('relaySlotSecret')) {
            edgeEnv['RELAY_SLOT_SECRET'] = project.property('relaySlotSecret').toString()
        }
        if (refereeOn) {
            edgeEnv['RELAY_CONTROL_SECRET'] = project.ext.devRefereeSecret.call()
            edgeEnv['RELAY_CONTROL_PORT'] = project.ext.devRefereePort.call().toString()
        }
        if (refereeOn && !project.hasProperty('relaySlotSecret')) {
            logger.lifecycle('edges will NOT authorize a referee: without -PrelaySlotSecret they'
                    + ' cannot derive the per-slot tokens the relay binds HELLO against. Duels still'
                    + ' run, on two witnesses instead of three.')
        }
        project.ext.edgeNodes.each { node ->
            def dir = new File(project.ext.devRoot, node.name)
            spawn([javaExe, '-Xms1G', '-Xmx2G', '-jar', project.ext.paperJar.absolutePath, '--nogui'],
                    dir, node.name, edgeEnv)
        }

        Runtime.runtime.addShutdownHook(new Thread({
            procs.each { p -> p.destroy() }
        }))

        logger.lifecycle('')
        logger.lifecycle('  edge-a  127.0.0.1:25566  (slot 0)')
        logger.lifecycle('  edge-b  127.0.0.1:25567  (slot 1)')
        logger.lifecycle('  relay   127.0.0.1:7777')
        if (refereeOn) {
            logger.lifecycle('  referee 127.0.0.1:' + project.ext.devRefereePort.call()
                    + '  (tcp control endpoint, RELAY_CONTROL_SECRET='
                    + project.ext.devRefereeSecret.call() + ')')
            logger.lifecycle('          devAssign authorizes every session it pushes, the relay')
            logger.lifecycle('          re-simulates both input streams and prints its signed')
            logger.lifecycle('          verdict here as  [relay] referee verdict: ...')
            logger.lifecycle('          in production mcleagues-core is what authorizes and what')
            logger.lifecycle('          consumes that verdict; set rollback.referee.control-secret')
            logger.lifecycle('          to the SAME value there. -PnoReferee starts without it.')
        } else {
            logger.lifecycle('  referee NOT STARTED (-PnoReferee) - results rest on the two clients')
            logger.lifecycle('          corroborating each other, which is the degraded path')
        }
        project.ext.edgeNodes.each { n ->
            logger.lifecycle('  metrics 127.0.0.1:' + n.metricsPort + '/metrics  (' + n.name
                    + ')')
        }
        if (limboStarted) {
            logger.lifecycle('  limbo   127.0.0.1:' + project.ext.limboBindPort
                    + '  (a MOD-hosted slot is transferred here)')
            if (!project.ext.limboReady.call()) {
                logger.lifecycle('          NO CAPTURE FILES - the limbo will accept the connection'
                        + ' and never spawn the client. See gradlew devLimboConfig.')
            }
        } else {
            logger.lifecycle('  limbo   NOT STARTED (-PnoLimbo) - -Pmod assignments have nowhere to go')
        }
        logger.lifecycle('')
        logger.lifecycle('  arena   plugins/JackpotEdge/arena.bin per node (missing = flat fallback)')
        logger.lifecycle('')
        logger.lifecycle('  EDGE vs EDGE : join each with a separate account, run /edge on both, or')
        logger.lifecycle('                 push gradlew devAssign -PplayerA=x -PplayerB=y')
        logger.lifecycle('  MOD  vs MOD  : gradlew devAssign -PplayerA=x -PplayerB=y -Pmod=both'
                + ' -ParenaName=colosseum')
        logger.lifecycle('  MOD  vs EDGE : gradlew devAssign -PplayerA=x -PplayerB=y -Pmod=A'
                + ' -ParenaName=colosseum')
        logger.lifecycle('  a MOD slot needs the rollback mod on that client AND a shipped arena.')
        logger.lifecycle('  /edge only starts once both edges agree on the arena hash.')
        logger.lifecycle('')
        logger.lifecycle('  to stop: run  gradlew devStop  in another terminal')
        logger.lifecycle('  (ctrl-c is unreliable here - gradle traps it to cancel the build)')
        logger.lifecycle('')

        procs.each { p -> p.waitFor() }
    }
}

tasks.register('devWipeWorlds') {
    group = 'devenv'
    description = 'Delete the dev edge world folders so the next match pastes its arena into an' +
            ' empty world. The dev world PERSISTS across devRun invocations and across server' +
            ' restarts, so blocks a match left behind accumulate in it forever.'
    doLast {
        int wiped = 0
        project.ext.edgeNodes.each { node ->
            def world = new File(new File(project.ext.devRoot, node.name), 'world')
            if (world.isDirectory()) {
                if (!project.delete(world)) {
                    throw new GradleException('could not delete ' + world.absolutePath
                            + ' - stop the dev stack first with  gradlew devStop')
                }
                wiped++
                logger.lifecycle('wiped ' + world.absolutePath)
            }
        }
        if (wiped == 0) {
            logger.lifecycle('no dev world folders to wipe - they are recreated on the next devRun')
        } else {
            logger.lifecycle('' + wiped + ' dev world(s) wiped. The flat generator rebuilds them on'
                    + ' the next start, so the next arena paste lands in an empty world.')
        }
    }
}

tasks.register('devStop') {
    group = 'devenv'
    description = 'Stop the relay and both edge servers started by devRun.'
    doLast {
        def pidDir = new File(project.ext.devRoot, 'pids')
        def files = pidDir.listFiles()
        if (files == null || files.length == 0) {
            logger.lifecycle('nothing to stop (no pid files in ' + pidDir + ')')
            return
        }
        def handles = []
        files.each { f ->
            def tag = f.name.replace('.pid', '')
            try {
                def handle = ProcessHandle.of(Long.parseLong(f.text.trim()))
                if (handle.isPresent() && handle.get().isAlive()) {
                    logger.lifecycle('stopping ' + tag + ' (pid ' + f.text.trim() + ')')
                    handle.get().destroy()
                    handles.add(handle.get())
                } else {
                    logger.lifecycle(tag + ' already stopped')
                }
            } catch (Exception e) {
                logger.lifecycle('could not stop ' + tag + ': ' + e)
            }
            f.delete()
        }
        def deadline = System.currentTimeMillis() + 15000
        handles.each { h ->
            while (h.isAlive() && System.currentTimeMillis() < deadline) {
                Thread.sleep(200)
            }
            if (h.isAlive()) {
                logger.lifecycle('force killing pid ' + h.pid())
                h.destroyForcibly()
            }
        }
        logger.lifecycle('devenv stopped')
    }
}

