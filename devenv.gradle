tasks.register('devLimboConfig') {
    group = 'devenv'
    description = 'Write build/devenv/limbo.properties, pointing the limbo at the checked-in captures.'
    doLast {
        project.ext.devRoot.mkdirs()
        def src = new File(project.ext.limboDir, 'limbo.properties')
        def props = new Properties()
        if (src.exists()) {
            src.withInputStream { s -> props.load(s) }
        }
        props.setProperty('bind.host', '127.0.0.1')
        props.setProperty('bind.port', String.valueOf(project.ext.limboBindPort))
        props.setProperty('proxy.host', '127.0.0.1')
        props.setProperty('proxy.port', String.valueOf(project.ext.limboReturnPort))
        project.ext.limboVersions.each { v ->
            def cfg = project.ext.limboCaptureFile(v.mc, 'config').absolutePath
            def play = project.ext.limboCaptureFile(v.mc, 'play').absolutePath
            if (v.slot == 'main') {
                props.setProperty('packets.config', cfg)
                props.setProperty('packets.play', play)
            } else if (v.slot == 'alt') {
                props.setProperty('packets.config.alt', cfg)
                props.setProperty('packets.play.alt', play)
            } else {
                props.setProperty(v.slot + '.config', cfg)
                props.setProperty(v.slot + '.play', play)
            }
        }
        props.setProperty('forwarding.secret', '')
        props.setProperty('play.native.enabled', 'false')
        props.setProperty('redis.host', '')
        def missing = project.ext.limboMissing.call()
        props.setProperty('captures.lenient', String.valueOf(!missing.isEmpty()))
        def out = new File(project.ext.devRoot, 'limbo.properties')
        out.withOutputStream { s -> props.store(s, 'generated by gradlew devLimboConfig') }
        logger.lifecycle('wrote ' + out)
        logger.lifecycle('  listening on 127.0.0.1:' + project.ext.limboBindPort
                + ', return transfers go to 127.0.0.1:' + project.ext.limboReturnPort)
        logger.lifecycle('  serving ' + project.ext.limboVersions.collect {
            it.mc + '/' + it.protocol
        }.join(', '))
        if (!missing.isEmpty()) {
            logger.error('')
            logger.error('  ################################################################')
            logger.error('  ##  NO LIMBO CAPTURE FOR: ' + missing.collect { it.mc + ' (protocol '
                    + it.protocol + ')' }.join(', '))
            logger.error('  ##  A client on that Minecraft version CANNOT be transferred to the')
            logger.error('  ##  limbo at all - it is refused at login. Every MOD-hosted slot on')
            logger.error('  ##  that version is dead before the match starts.')
            missing.each { v ->
                logger.error('  ##    gradlew devLimboCapture -PcaptureVersion=' + v.mc)
            }
            logger.error('  ################################################################')
            logger.error('')
        }
    }
}

tasks.register('devLimboCapture') {
    group = 'devenv'
    description = 'Record the limbo config/play capture for one Minecraft version, with no human and no' +
            ' game client: it downloads that version of Paper, reads the packet ids out of the' +
            ' server\'s own --reports packet report, logs a headless client in and writes' +
            ' limbo/config-<version>.bin + limbo/play-<version>.bin.\n' +
            '  gradlew devLimboCapture -PcaptureVersion=26.1.2 [-PcapturePort=25599]\n' +
            '                          [-PcaptureViewDistance=8] [-PcapturePlayMs=12000]'
    doLast {
        def mc = (project.findProperty('captureVersion') ?: '').toString()
        if (mc.isEmpty()) {
            throw new GradleException('pass -PcaptureVersion=<minecraft version>, one of '
                    + project.ext.limboVersions.collect { it.mc })
        }
        def port = (project.findProperty('capturePort') ?: '25599').toString() as int
        def viewDistance = (project.findProperty('captureViewDistance') ?: '8').toString() as int
        def playMs = (project.findProperty('capturePlayMs') ?: '12000').toString()

        def jar = project.ext.downloadPaper.call(mc)
        def meta = project.ext.paperVersionMeta.call(jar)
        logger.lifecycle('capturing ' + mc + ': protocol ' + meta.protocol + ', needs java '
                + meta.java)
        def javaExe = project.ext.javaLauncherFor.call(meta.java)
        def reports = project.ext.paperPacketReport.call(mc, jar, javaExe)

        def dir = new File(project.ext.devRoot, 'capture-' + mc)
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        def props = new StringBuilder()
        props.append('server-port=').append(port).append('\n')
        props.append('online-mode=false\n')
        props.append('network-compression-threshold=-1\n')
        props.append('level-type=minecraft\\:flat\n')
        props.append('generator-settings=' + project.ext.FLAT_SETTINGS + '\n')
        props.append('level-name=world\n')
        props.append('level-seed=jackpotlimbo\n')
        props.append('gamemode=survival\n')
        props.append('difficulty=peaceful\n')
        props.append('spawn-monsters=false\n')
        props.append('spawn-protection=0\n')
        props.append('allow-nether=false\n')
        props.append('max-players=2\n')
        props.append('view-distance=').append(viewDistance).append('\n')
        props.append('simulation-distance=4\n')
        props.append('sync-chunk-writes=false\n')
        props.append('enable-status=true\n')
        props.append('motd=limbo capture\n')
        new File(dir, 'server.properties').text = props.toString()

        def serverProc = new ProcessBuilder([javaExe, '-Xms1G', '-Xmx2G', '-jar',
                                             jar.absolutePath, '--nogui'])
                .directory(dir).redirectErrorStream(true).start()
        def ready = new java.util.concurrent.CountDownLatch(1)
        def pump = new Thread({
            serverProc.inputStream.eachLine { line ->
                println('[capture-server] ' + line)
                if (line.contains('Done (') || line.contains('For help, type')) {
                    ready.countDown()
                }
            }
        })
        pump.setDaemon(true)
        pump.start()
        try {
            if (!ready.await(600, java.util.concurrent.TimeUnit.SECONDS)) {
                throw new GradleException('the ' + mc + ' capture server never finished starting')
            }
            Thread.sleep(2000)

            def configOut = project.ext.limboCaptureFile(mc, 'config')
            def playOut = project.ext.limboCaptureFile(mc, 'play')
            def cp = project(':limbo').sourceSets.main.runtimeClasspath.asPath
            def args = ['-cp', cp,
                        '-Dcapture.host=127.0.0.1',
                        '-Dcapture.port=' + port,
                        '-Dcapture.protocol=' + meta.protocol,
                        '-Dcapture.username=LimboCapture',
                        '-Dcapture.viewDistance=' + viewDistance,
                        '-Dcapture.play.ms=' + playMs,
                        '-Dcapture.config.out=' + configOut.absolutePath,
                        '-Dcapture.play.out=' + playOut.absolutePath]
            project.ext.captureIdProperties.call(reports).each { k, v -> args.add('-D' + k + '=' + v) }
            args.add('me.nootnoot.limbo.HeadlessCapture')
            def clientProc = new ProcessBuilder([javaExe] + args)
                    .directory(project.ext.devRoot).redirectErrorStream(true).start()
            clientProc.inputStream.eachLine { line -> println('[capture] ' + line) }
            int code = clientProc.waitFor()
            if (code != 0) {
                throw new GradleException('the headless capture client failed with exit ' + code)
            }
            logger.lifecycle('')
            logger.lifecycle('wrote ' + configOut + ' (' + configOut.length() + 'B)')
            logger.lifecycle('wrote ' + playOut + ' (' + playOut.length() + 'B)')
            logger.lifecycle('now run:  gradlew devLimboConfig devLimboProbe')
        } finally {
            serverProc.destroy()
            serverProc.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)
            serverProc.destroyForcibly()
        }
    }
}

tasks.register('devLimboProbe') {
    group = 'devenv'
    description = 'Start the limbo on a scratch port and PROVE that a client of every configured' +
            ' Minecraft version can log in, spawn and be transferred back out again. Fails the' +
            ' build if any of them cannot.'
    dependsOn 'devLimboConfig', ':limbo:jar'
    doLast {
        def javaExe = System.getProperty('java.home') + '/bin/java'
        def cfgFile = new File(project.ext.devRoot, 'limbo.properties')
        def props = new Properties()
        cfgFile.withInputStream { s -> props.load(s) }
        def probePort = (project.findProperty('probePort') ?: '25597').toString() as int
        props.setProperty('bind.port', String.valueOf(probePort))
        props.setProperty('captures.lenient', 'true')
        def probeCfg = new File(project.ext.devRoot, 'limbo-probe.properties')
        probeCfg.withOutputStream { s -> props.store(s, 'generated by gradlew devLimboProbe') }

        def limboJar = project(':limbo').tasks.named('jar').get().archiveFile.get().asFile
        def limboProc = new ProcessBuilder([javaExe, '-jar', limboJar.absolutePath,
                                            probeCfg.absolutePath])
                .directory(project.ext.devRoot).redirectErrorStream(true).start()
        def pump = new Thread({
            limboProc.inputStream.eachLine { line -> println('[limbo] ' + line) }
        })
        pump.setDaemon(true)
        pump.start()
        try {
            def deadline = System.currentTimeMillis() + 60000
            boolean up = false
            while (!up && System.currentTimeMillis() < deadline) {
                try {
                    new Socket('127.0.0.1', probePort).close()
                    up = true
                } catch (IOException notYet) {
                    Thread.sleep(250)
                }
            }
            if (!up) {
                throw new GradleException('the limbo never bound 127.0.0.1:' + probePort
                        + ' - see the [limbo] lines above')
            }
            def cp = project(':limbo').sourceSets.main.runtimeClasspath.asPath
            def failures = []
            project.ext.limboVersions.each { v ->
                def probeArgs = ['-cp', cp,
                                 '-Dprobe.config=' + probeCfg.absolutePath,
                                 '-Dprobe.host=127.0.0.1',
                                 '-Dprobe.port=' + probePort,
                                 '-Dprobe.protocol=' + v.protocol,
                                 '-Dprobe.name=' + v.mc]
                def report = new File(project.ext.devRoot, 'reports-' + v.mc + '/reports/packets.json')
                if (report.exists()) {
                    def parsed = new groovy.json.JsonSlurper().parse(report)
                    def ids = project.ext.captureIdProperties.call(parsed)
                    probeArgs.add('-Dprobe.id.keepAlive=' + ids['id.play.cb.keepAlive'])
                    probeArgs.add('-Dprobe.id.transfer=' + project.ext.playTransferId.call(parsed))
                    probeArgs.add('-Dprobe.id.customPayload=' + ids['id.play.sb.customPayload'])
                    probeArgs.add('-Dprobe.id.chunk=' + ids['id.play.cb.chunk'])
                    probeArgs.add('-Dprobe.id.disconnect=' + ids['id.play.cb.disconnect'])
                } else {
                    logger.warn('  no packet report for ' + v.mc + ' under ' + report.parentFile
                            + ' - the play ids are NOT cross-checked against that version own packet report.'
                            + ' Run gradlew devLimboCapture -PcaptureVersion=' + v.mc + ' once.')
                }
                probeArgs.add('me.nootnoot.limbo.LimboProbeMain')
                def proc = new ProcessBuilder([javaExe] + probeArgs)
                        .directory(project.ext.devRoot).redirectErrorStream(true).start()
                proc.inputStream.eachLine { line -> println('[probe] ' + line) }
                if (proc.waitFor() != 0) {
                    failures.add(v.mc + ' (protocol ' + v.protocol + ')')
                }
            }
            if (!failures.isEmpty()) {
                throw new GradleException('the limbo CANNOT serve: ' + failures.join(', ')
                        + '. Record the capture with gradlew devLimboCapture -PcaptureVersion=<version>')
            }
            logger.lifecycle('')
            logger.lifecycle('  every configured version logged in, spawned and transferred back out.')
        } finally {
            limboProc.destroy()
            limboProc.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)
            limboProc.destroyForcibly()
        }
    }
}

ext.downloadPaper = { String mc ->
    def jar = new File(project.ext.devRoot, 'paper-' + mc + '.jar')
    if (jar.exists() && jar.length() > 0) {
        return jar
    }
    project.ext.devRoot.mkdirs()
    def api = 'https://fill.papermc.io/v3/projects/paper/versions/' + mc + '/builds'
    def builds = new groovy.json.JsonSlurper().parse(new URL(api))
    def stable = builds.findAll { b -> b.channel == 'STABLE' }
    def latest = stable.isEmpty() ? builds.first() : stable.first()
    def download = latest.downloads['server:default']
    logger.lifecycle('downloading ' + download.url + ' (' + download.size + ' bytes)')
    def stream = new URL(download.url).openStream()
    try {
        java.nio.file.Files.copy(stream, jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    } finally {
        stream.close()
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes)
    def hex = digest.collect { String.format('%02x', it) }.join('')
    if (hex != download.checksums.sha256) {
        jar.delete()
        throw new GradleException('sha256 mismatch for ' + jar.name + ': got ' + hex
                + ', papermc published ' + download.checksums.sha256)
    }
    logger.lifecycle('saved ' + jar + ' (sha256 verified)')
    return jar
}

ext.paperVersionMeta = { File jar ->
    def zip = new java.util.zip.ZipFile(jar)
    try {
        def entry = zip.getEntry('version.json')
        if (entry == null) {
            throw new GradleException(jar.name + ' has no version.json')
        }
        def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
        return [id: json.id, protocol: json.protocol_version, java: json.java_version]
    } finally {
        zip.close()
    }
}

ext.javaLauncherFor = { int feature ->
    def service = project(':limbo').extensions
            .getByType(org.gradle.jvm.toolchain.JavaToolchainService)
    return service.launcherFor { spec ->
        spec.languageVersion = JavaLanguageVersion.of(feature)
    }.get().executablePath.asFile.absolutePath
}

ext.paperPacketReport = { String mc, File jar, String javaExe ->
    def dir = new File(project.ext.devRoot, 'reports-' + mc)
    def report = new File(dir, 'reports/packets.json')
    if (report.exists() && report.length() > 0) {
        return new groovy.json.JsonSlurper().parse(report)
    }
    dir.mkdirs()
    logger.lifecycle('generating the ' + mc + ' packet report (this is the source of every packet id)')
    def proc = new ProcessBuilder([javaExe, '-DbundlerMainClass=net.minecraft.data.Main',
                                   '-jar', jar.absolutePath, '--reports', '--output',
                                   dir.absolutePath])
            .directory(project.ext.devRoot).redirectErrorStream(true).start()
    proc.inputStream.eachLine { line -> logger.info('[reports] ' + line) }
    if (proc.waitFor() != 0 || !report.exists()) {
        throw new GradleException('could not generate the packet report for ' + mc)
    }
    return new groovy.json.JsonSlurper().parse(report)
}

ext.playTransferId = { report ->
    def entry = report['play']['clientbound']['minecraft:transfer']
    if (entry == null) {
        throw new GradleException('the packet report has no play/clientbound/transfer')
    }
    return entry.protocol_id
}

