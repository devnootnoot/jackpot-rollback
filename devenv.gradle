tasks.register('devAssign', JavaExec) {
    group = 'devenv'
    description = 'Push a match assignment into the dev Redis so both edges start a brokered match.\n' +
            '  gradlew devAssign -PplayerA=<name> -PplayerB=<name> [-PgameType=<type>]\n' +
            '                    [-ParenaName=<arena>] [-Pmod=<who>] [-PnoDevKit]\n' +
            '    -Pmod        which slots host the sim on their own MODDED client instead of on\n' +
            '                 their edge. none (default) | A | B | both. A MOD slot is sent the\n' +
            '                 match_setup + arena + cage plugin messages by its edge and then\n' +
            '                 transferred to the limbo, which is exactly what mcleagues-core\n' +
            '                 RollbackHandoffManager does on the network. It REQUIRES -ParenaName:\n' +
            '                 a modded client has no local arena file to fall back on, so without\n' +
            '                 shipped bytes it would fight on a bare plane and desync.\n' +
            '                   -Pmod=both   MOD vs MOD   (both clients need the mod + the limbo)\n' +
            '                   -Pmod=A      MOD vs EDGE  (cross-play; playerA is the modded one)\n' +
            '                   (omit)       EDGE vs EDGE\n' +
            '    -ParenaName  load a REAL arena from the practice .farena data, publish its bytes\n' +
            '                 to the dev Redis and point BOTH slots at that one key, exactly like\n' +
            '                 mcleagues-core does. The two edges then decode byte-identical bytes,\n' +
            '                 so the arena handshake passes. The assignment also carries the\n' +
            '                 arena\'s REAL ArenaSpawn coordinates (with the cage drop added), so\n' +
            '                 there are no made-up spawn points anywhere in this path.\n' +
            '                 examples:  -ParenaName=colosseum   -ParenaName=courtyard\n' +
            '    -ParenaDir   where the .farena files live (default: the practice arenas folder\n' +
            '                 next to this checkout). Run devAssign with no players to list them.\n' +
            '    -PplayRadius X/Z half-extent extracted around the spawn midpoint (default 110,\n' +
            '                 the largest real borderRadius + margin core uses).\n' +
            '    NOTE: the palette geometry devAssign ships is a DEV HEURISTIC read off the block\n' +
            '    state strings - it is the same on both edges but it is NOT the server VoxelShape\n' +
            '    table mcleagues-core encodes. Slabs/carpets/plates are modelled, stairs and\n' +
            '    fences are treated as full cubes. Use a real core match to test exact collision.\n' +
            '    -PgameType   which demo kit BOTH edges build for the match. Case-insensitive, and\n' +
            '                 matched against the mcleagues-core GameType names, so those work as-is:\n' +
            '                   IRON           diamond sword + full iron + 64 cobblestone + 8 gapples\n' +
            '                   DIAMOND        diamond sword + full diamond + 16 gapples + 16 pearls\n' +
            '                   POT            diamond sword + full diamond + 25 splash healing +\n' +
            '                                  3 splash harming + 2 speed + 2 strength +\n' +
            '                                  2 fire resistance\n' +
            '                   NETHERITE_POT  netherite sword + full netherite + the same pots\n' +
            '                   CRYSTAL        full netherite + 192 end crystals + 128 obsidian +\n' +
            '                                  64 respawn anchors + 64 glowstone + 3 loose totems +\n' +
            '                                  1 in the off-hand + 2 totem-filled shulkers +\n' +
            '                                  64 each of flight 1/2/3 rockets + efficiency V\n' +
            '                                  netherite pickaxe + netherite axe + bow + a loaded\n' +
            '                                  crossbow + a second loaded crossbow with Multishot +\n' +
            '                                  64 arrows and 64 arrows of weakness + 64 wind\n' +
            '                                  charges + 8 ender chests + a plain mace + a second\n' +
            '                                  mace with Wind Burst III and Breach IV + shield +\n' +
            '                                  water/lava buckets + cobwebs + pearls +\n' +
            '                                  128 golden apples + 16 enchanted golden apples.\n' +
            '                                  The ELYTRA sits in the HOTBAR\n' +
            '                                  (slot 7 on the bar): InventoryIntents.chestEquip only\n' +
            '                                  fires for a hotbar slot, so from storage it took an\n' +
            '                                  inventory drag first and read as unreachable.\n' +
            '                 EdgeGameTypes maps each production name to one of those five kits:\n' +
            '                 SWORD/BOW/AXE -> IRON, the SMP and UHC family -> DIAMOND, POT -> POT,\n' +
            '                 NETHERITE_POT -> NETHERITE_POT, and VANILLA, HT_VANILLA, LT_CART,\n' +
            '                 HT_CART, CREEPER, MACE, SPEAR_MACE, SPEAR_ELYTRA and CUSTOM ->\n' +
            '                 CRYSTAL. A name the table has never heard of, and no flag at all,\n' +
            '                 both give CRYSTAL - the only kit with every mechanic on.\n' +
            '                 examples:  -PgameType=CRYSTAL   -PgameType=pot   -PgameType=HT_VANILLA\n' +
            '    -PnoDevKit   push the assignment with NO kit at all (both players empty-handed).\n' +
            '  The demo kit is built ON each edge and encoded into the same setup bytes a real\n' +
            '  mcleagues-core match sends, so both paths run the identical decoder. It only agrees\n' +
            '  between the two edges when they run the same build.\n' +
            '  Without -ParenaName devAssign carries no arena bytes and the edges use their local\n' +
            '  arena.bin (gradlew devSampleArena) or the flat fallback, so devRun still works with\n' +
            '  no core and no Redis.\n' +
            '\n' +
            '  THE REFEREE. devAssign also authorizes the session with the relay control\n' +
            '  endpoint, which is what mcleagues-core does at handoff. The relay then\n' +
            '  re-simulates both input streams off the packets it forwards and prints a\n' +
            '  signed verdict in the devRun window as\n' +
            '      [relay] referee verdict: session <id> - slot 0 wins 3-1 after ...\n' +
            '  On the network that verdict is a third witness outranking either client, so\n' +
            '  a loser who refuses to concede can no longer force a VOID. devAssign is not\n' +
            '  core: it authorizes and walks away, so nothing here acts on the verdict.\n' +
            '    -PrelayControlSecret  must match RELAY_CONTROL_SECRET on the relay. devRun\n' +
            '                 and devAssign read the same property, so they agree by default.\n' +
            '    -PrelayControlPort    default 7778.\n' +
            '    -PnoReferee  push the assignment with NO third witness, which is the\n' +
            '                 degraded two-witness path a relay with no control secret runs.'
    doFirst {
        def notBrokering = []
        def unprovisioned = []
        project.ext.edgeNodes.each { node ->
            def cfg = new File(project.ext.devRoot, node.name + '/plugins/JackpotEdge/config.yml')
            if (!cfg.exists()) {
                unprovisioned.add(node.name)
                return
            }
            def brokered = false
            boolean inBroker = false
            cfg.eachLine { line ->
                if (line ==~ /^\S.*/) {
                    inBroker = line.trim().startsWith('broker:')
                }
                if (inBroker && line.trim().startsWith('enabled:')) {
                    brokered = line.trim().endsWith('true')
                }
            }
            if (!brokered) {
                notBrokering.add(node.name)
            }
        }
        if (!unprovisioned.isEmpty()) {
            throw new GradleException('devAssign would push an assignment nobody is listening for: '
                    + unprovisioned.join(' and ') + ' has no plugins/JackpotEdge/config.yml under '
                    + project.ext.devRoot + '. Run gradlew devSetup (or devRunBrokered) first.')
        }
        if (!notBrokering.isEmpty()) {
            logger.error('')
            logger.error('  ################################################################')
            logger.error('  ##  ' + notBrokering.join(' and ')
                    + (notBrokering.size() > 1 ? ' HAVE' : ' HAS') + ' broker.enabled: false')
            logger.error('  ##')
            logger.error('  ##  devAssign only pushes JSON into Redis. An edge that is not')
            logger.error('  ##  brokering never reads that list, so this assignment would be')
            logger.error('  ##  a SILENT no-op: no error, no match, nothing in either log.')
            logger.error('  ##')
            logger.error('  ##  A plain "gradlew devRun" provisions both edges with the broker')
            logger.error('  ##  OFF. Restart them in broker mode:')
            logger.error('  ##      gradlew devStop')
            logger.error('  ##      gradlew devRunBrokered')
            logger.error('  ##  and push the assignment from a second terminal.')
            logger.error('  ##')
            logger.error('  ##  -PforceAssign pushes anyway (only useful if you are about to')
            logger.error('  ##  restart the edges in broker mode before the 120s TTL expires).')
            logger.error('  ################################################################')
            logger.error('')
            if (!project.hasProperty('forceAssign')) {
                throw new GradleException('refusing to push an assignment to a stack that is not'
                        + ' brokering - see the block above')
            }
            logger.warn('  -PforceAssign given: pushing anyway.')
        }
    }
    dependsOn ':edge:classes'
    classpath = project(':edge').sourceSets.main.runtimeClasspath
    mainClass = 'me.nootnoot.edge.tools.DevAssignMain'
    ['playerA', 'playerB', 'edgeA', 'edgeB', 'redisHost', 'redisPort', 'relayHost', 'relayPort',
     'groundY', 'rounds', 'gameType', 'arenaName', 'playRadius', 'arenaMaxBlocks',
     'directA', 'directB', 'mod', 'relaySlotSecret', 'lagA', 'lagB'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key).toString()
        }
    }
    systemProperty 'devKit', project.hasProperty('noDevKit') ? 'false' : 'true'
    systemProperty 'arenaDir', project.ext.realArenaDir.toString()
    systemProperty 'relayControlSecret', project.ext.devRefereeSecret.call()
    systemProperty 'relayControlPort', project.ext.devRefereePort.call().toString()
    systemProperty 'noReferee', project.hasProperty('noReferee') ? 'true' : ''
    maxHeapSize = (project.findProperty('devAssignHeap') ?: '4g').toString()
}

tasks.register('devRunBrokered') {
    group = 'devenv'
    description = 'Start the dev stack + relay + limbo + both edges in BROKER mode (matches come' +
            ' from Redis). This one command backs all three configurations; which one you get is' +
            ' decided by devAssign -Pmod.'
    dependsOn 'devStackUp', 'devRun'
    doLast {
    }
}

tasks.named('devRun').configure {
    mustRunAfter 'devStackUp'
}

