ext.devStack = new File(projectDir, 'devstack')

def composeCmd = { List extra ->
    def cmd = ['docker', 'compose', '-f', new File(project.ext.devStack, 'docker-compose.yml').absolutePath]
    cmd.addAll(extra)
    return cmd
}

def runCompose = { List extra, boolean failOnError ->
    def pb = new ProcessBuilder(composeCmd(extra))
    pb.redirectErrorStream(true)
    def proc = pb.start()
    proc.inputStream.eachLine { line -> println('[devstack] ' + line) }
    int code = proc.waitFor()
    if (code != 0 && failOnError) {
        throw new GradleException('docker compose ' + extra.join(' ') + ' failed with exit ' + code
                + ' - is Docker Desktop running?')
    }
    return code
}

