tasks.register('devDownloadPaper') {
    group = 'devenv'
    description = 'Download the Paper server jar into build/devenv.'
    doLast {
        def jar = project.ext.paperJar
        if (jar.exists() && jar.length() > 0) {
            logger.lifecycle('paper already present: ' + jar)
            return
        }
        project.ext.devRoot.mkdirs()
        def api = 'https://fill.papermc.io/v3/projects/paper/versions/' + project.ext.paperVersion
        def slurper = new groovy.json.JsonSlurper()
        def builds = slurper.parse(new URL(api + '/builds'))
        def stable = builds.findAll { b -> b.channel == 'STABLE' }
        def latest = stable.isEmpty() ? builds.first() : stable.first()
        def url = latest.downloads['server:default'].url
        logger.lifecycle('downloading ' + url)
        def stream = new URL(url).openStream()
        try {
            java.nio.file.Files.copy(stream, jar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            stream.close()
        }
        logger.lifecycle('saved ' + jar + ' (' + jar.length() + ' bytes)')
    }
}

ext.EDGE_EXPECTED_FILE = 'expected-plugin.sha256'

ext.sha256Of = { File f ->
    java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
}

ext.stampEdgePlugin = { File dir, String want ->
    def marker = new File(dir, 'plugins/JackpotEdge/' + project.ext.EDGE_EXPECTED_FILE)
    marker.parentFile.mkdirs()
    marker.text = [
            want,
            '# EdgeBuildFence reads the first line above and refuses to enable when the jar it',
            '# was loaded from hashes to anything else. Protocol.VERSION cannot catch a stale',
            '# edge: it only moves when simulated behaviour or the checksum function moves, and',
            '# every other edge change leaves it alone.',
            '# written by gradlew devSetup and by :edge:jar',
            ''
    ].join(System.lineSeparator())
    return marker
}

ext.EDGE_PLUGIN_FILE = 'jackpot-edge.jar'

ext.EDGE_REMAP_DIR = '.paper-remapped'

ext.EDGE_REMAP_INDEX = 'index.json'

ext.clearRemapCache = { File pluginsDir ->
    def remapped = new File(pluginsDir, project.ext.EDGE_REMAP_DIR)
    if (!remapped.exists()) {
        return ''
    }
    project.delete(remapped)
    if (remapped.exists()) {
        return 'could not clear the Paper remap cache at ' + remapped
                + '. Paper hands the plugin the REMAPPED copy under that directory, not the jar'
                + ' this build just wrote next to it, so a surviving entry there is what the'
                + ' server runs. Stop every server under build/devenv and provision again:'
                + '  gradlew devSetup'
    }
    return ''
}

ext.remapOriginHashes = { File pluginsDir ->
    def index = new File(new File(pluginsDir, project.ext.EDGE_REMAP_DIR),
            project.ext.EDGE_REMAP_INDEX)
    def byName = [:]
    if (!index.isFile()) {
        return byName
    }
    try {
        def root = new JsonSlurper().parse(index)
        def hashes = (root instanceof Map) ? root['hashes'] : null
        if (hashes instanceof Map) {
            hashes.each { origin, name ->
                byName[name.toString()] = origin.toString().toLowerCase(Locale.ROOT)
            }
        }
    } catch (Exception unreadable) {
        return null
    }
    return byName
}

ext.edgeLoadProblems = { File dir, String want ->
    def problems = []
    def pluginsDir = new File(dir, 'plugins')
    if (!pluginsDir.isDirectory()) {
        problems.add('there is no plugins directory at ' + pluginsDir)
        return problems
    }
    def target = new File(pluginsDir, project.ext.EDGE_PLUGIN_FILE)
    if (!target.isFile()) {
        problems.add('there is no plugin at ' + target)
        return problems
    }
    def deployed = project.ext.sha256Of.call(target)
    if (deployed != want) {
        problems.add('the plugin at ' + target + ' holds sha256 ' + deployed.substring(0, 16)
                + ' and this tree builds ' + want.substring(0, 16))
    }
    pluginsDir.listFiles()?.each { f ->
        if (f.isFile() && f.name.endsWith('.jar') && f.name != target.name) {
            problems.add('a second jar is in the plugins directory: ' + f + '. Paper loads every'
                    + ' jar it finds there, so that one is loaded too and this build did not'
                    + ' write it.')
        }
    }
    def remapDir = new File(pluginsDir, project.ext.EDGE_REMAP_DIR)
    if (!remapDir.isDirectory()) {
        return problems
    }
    def origins = project.ext.remapOriginHashes.call(pluginsDir)
    remapDir.listFiles()?.each { f ->
        if (!f.isFile() || !f.name.endsWith('.jar')) {
            return
        }
        if (origins == null) {
            problems.add('a remapped copy sits at ' + f + ' and ' + project.ext.EDGE_REMAP_DIR
                    + '/' + project.ext.EDGE_REMAP_INDEX + ' cannot be read, so nothing on disk'
                    + ' says which jar the server would actually be loading')
            return
        }
        def origin = origins[f.name]
        if (origin == null) {
            problems.add('a remapped copy sits at ' + f + ' that ' + project.ext.EDGE_REMAP_INDEX
                    + ' does not account for. Paper hands the plugin THIS file, and EdgeBuildFence'
                    + ' falls back to hashing ' + target + ' when the index cannot say where the'
                    + ' copy came from, so a stale copy here reads as fresh on both sides.')
        } else if (origin != want) {
            problems.add('the remapped copy at ' + f + ' is the remap of sha256 '
                    + origin.substring(0, 16) + ', not of the ' + want.substring(0, 16)
                    + ' this tree builds. That copy is what the server loads; ' + target
                    + ' is only what it was made from.')
        }
    }
    return problems
}

ext.deployEdgePlugin = { File dir, File pluginJar ->
    def pluginsDir = new File(dir, 'plugins')
    pluginsDir.mkdirs()
    def target = new File(pluginsDir, project.ext.EDGE_PLUGIN_FILE)

    if (!pluginJar.isFile() || pluginJar.length() == 0) {
        throw new GradleException('the edge plugin jar ' + pluginJar + ' does not exist or is'
                + ' empty, so there is nothing to deploy. Provisioning a server directory without'
                + ' a plugin is how a run silently starts on the LAST jar that was there.')
    }

    pluginsDir.listFiles()?.each { f ->
        if (f.isFile() && f.name.endsWith('.jar') && f.name != target.name) {
            logger.lifecycle('deleting ' + f + ' - only jackpot-edge.jar is deployed here, and a'
                    + ' second edge jar under plugins/ loads alongside it')
            if (!f.delete()) {
                throw new GradleException('could not delete the stray plugin jar ' + f
                        + '. Stop the server that is holding it and provision again: leaving it'
                        + ' there starts the run against a jar this build did not produce.')
            }
        }
    }

    def remapFailure = project.ext.clearRemapCache.call(pluginsDir)
    if (!remapFailure.isEmpty()) {
        throw new GradleException(remapFailure)
    }

    if (target.exists() && !target.delete()) {
        throw new GradleException('could not replace ' + target + ' - something is holding it'
                + ' open (a running server, or an editor). Refusing rather than leaving the stale'
                + ' plugin in place: a stale edge jar aborts every match at the version fence.')
    }
    target.bytes = pluginJar.bytes
    if (target.length() != pluginJar.length()) {
        throw new GradleException('deployed ' + target + ' is ' + target.length() + ' bytes but '
                + pluginJar + ' is ' + pluginJar.length() + ' bytes, so the copy did not land.')
    }
    def want = project.ext.sha256Of.call(pluginJar)
    def got = project.ext.sha256Of.call(target)
    if (want != got) {
        throw new GradleException('deployed ' + target + ' does not match ' + pluginJar
                + ' byte for byte (' + got + ' vs ' + want + ').')
    }
    project.ext.stampEdgePlugin.call(dir, want)
    def fence = project.ext.simFenceOf.call(target)
    logger.lifecycle('deployed ' + target + ' (' + target.length() + 'B, sha256 '
            + want.substring(0, 16) + ', fence ' + fence.bytes + '/' + fence.rev + '/'
            + fence.version + ')')
    return fence
}

tasks.register('devSetup') {
    group = 'devenv'
    description = 'Provision two local edge servers under build/devenv with the edge plugin.'
    dependsOn 'devDownloadPaper', ':edge:jar', ':relay:jar', 'verifyEmbeddedSimVersion'
    finalizedBy 'devVerifyEdgeDeploy'
    doLast {
        def pidDir = new File(project.ext.devRoot, 'pids')
        pidDir.listFiles()?.each { f ->
            try {
                def stale = ProcessHandle.of(Long.parseLong(f.text.trim()))
                if (stale.isPresent() && stale.get().isAlive()) {
                    logger.lifecycle('killing stale ' + f.name.replace('.pid', '')
                            + ' (pid ' + f.text.trim() + ') before provisioning')
                    stale.get().destroyForcibly()
                    stale.get().onExit().get()
                }
            } catch (Exception ignored) {
            }
            f.delete()
        }

        def pluginJar = project(':edge').tasks.named('jar').get().archiveFile.get().asFile
        def edgeRounds = (project.findProperty('rounds') ?: '1').toString()
        def deployed = []
        project.ext.edgeNodes.each { node ->
            def dir = new File(project.ext.devRoot, node.name)
            def oldWorld = new File(dir, 'world')
            if (oldWorld.isDirectory() && !project.delete(oldWorld)) {
                throw new GradleException('could not delete ' + oldWorld.absolutePath
                        + ' - stop the dev stack first with  gradlew devStop')
            }
            new File(dir, 'plugins/JackpotEdge').mkdirs()
            new File(dir, 'eula.txt').text = 'eula=true\n'

            def props = new StringBuilder()
            props.append('server-port=').append(node.port).append('\n')
            props.append('online-mode=false\n')
            props.append('level-type=minecraft\\:flat\n')
            props.append('generator-settings=' + project.ext.FLAT_SETTINGS + '\n')
            props.append('level-name=world\n')
            props.append('gamemode=survival\n')
            props.append('difficulty=normal\n')
            props.append('spawn-monsters=false\n')
            props.append('spawn-animals=false\n')
            props.append('spawn-npcs=false\n')
            props.append('spawn-protection=0\n')
            props.append('allow-nether=false\n')
            props.append('max-players=4\n')
            props.append('view-distance=6\n')
            props.append('simulation-distance=6\n')
            props.append('sync-chunk-writes=false\n')
            props.append('motd=jackpot edge ').append(node.name).append('\n')
            new File(dir, 'server.properties').text = props.toString()

            def cfg = new StringBuilder()
            cfg.append('slot: ').append(node.slot).append('\n')
            cfg.append('session-id: 1\n')
            cfg.append('relay-host: 127.0.0.1\n')
            cfg.append('relay-port: 7777\n')
            cfg.append('direct:\n')
            cfg.append('  enabled: true\n')
            cfg.append('  port: ').append(node.directPort).append('\n')
            cfg.append('  advertise-host: 127.0.0.1\n')
            cfg.append('metrics:\n')
            cfg.append('  enabled: true\n')
            cfg.append('  port: ').append(node.metricsPort).append('\n')
            cfg.append('arena-file: arena.bin\n')
            cfg.append('arena-handshake-timeout-ticks: 600\n')
            cfg.append('rounds: ').append(edgeRounds).append('\n')
            cfg.append('arena:\n')
            cfg.append('  paste: true\n')
            cfg.append('  blocks-per-tick: 16384\n')
            cfg.append('  millis-per-tick: 30\n')
            cfg.append('  refuse-on-clip: true\n')
            cfg.append('spawn:\n')
            cfg.append('  x0: -4.0\n')
            cfg.append('  z0: 0.0\n')
            cfg.append('  x1: 4.0\n')
            cfg.append('  z1: 0.0\n')
            def NL = "\n"
            boolean devKit = !project.hasProperty('noDevKit')
            cfg.append('dev-kit:').append(NL)
            cfg.append('  enabled: ').append(devKit).append(NL)
            boolean brokered = project.hasProperty('broker')
                    || gradle.taskGraph.allTasks.any { it.name == 'devRunBrokered' }
            cfg.append('broker:').append(NL)
            cfg.append('  enabled: ').append(brokered).append(NL)
            cfg.append('  edge-id: ').append(node.name).append(NL)
            cfg.append('  region: ').append(node.region).append(NL)
            cfg.append('  public-host: 127.0.0.1').append(NL)
            cfg.append('  public-port: ').append(node.port).append(NL)
            cfg.append('  redis-host: 127.0.0.1').append(NL)
            cfg.append('  redis-port: 6380').append(NL)
            cfg.append('mod:').append(NL)
            cfg.append('  limbo-host: 127.0.0.1').append(NL)
            cfg.append('  limbo-port: ').append(project.ext.limboBindPort).append(NL)
            cfg.append('  transfer-delay-ticks: 40').append(NL)
            cfg.append('  require-hello: ')
                    .append(!project.hasProperty('allowUnmoddedHandoff')).append(NL)
