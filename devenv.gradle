tasks.register('devLimbo') {
    group = 'devenv'
    description = 'Run ONLY the limbo (the local stub server a MOD-hosted slot is transferred to).'
    dependsOn 'devLimboConfig', ':limbo:jar'
    doLast {
        def javaExe = System.getProperty('java.home') + '/bin/java'
        def limboJar = project(':limbo').tasks.named('jar').get().archiveFile.get().asFile
        def cfg = new File(project.ext.devRoot, 'limbo.properties')
